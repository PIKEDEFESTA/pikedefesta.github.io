
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festa Infantil | Pikedefesta</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #fff5fa;
  margin: 0;
  padding: 25px;
  text-align: center;
}

h1 {
  color: #ad498e;
}

.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 25px;
  max-width: 1100px;
  margin: 30px auto;
}

.produto {
  background: white;
  border-radius: 20px;
  padding: 15px;
  box-shadow: 0 4px 15px #00000012;
}

.produto img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  border-radius: 15px;
}

.produto h2 {
  color: #ad498e;
  font-size: 21px;
}

.preco {
  font-size: 23px;
  font-weight: bold;
  color: #ad498e;
}

.voltar {
  display: inline-block;
  margin-top: 25px;
  color: #ad498e;
}
</style>
</head>

<body>

<h1>🎂 Decorações Infantis</h1>
<p>Escolha o tema perfeito para sua festa!</p>

<div class="galeria">

  <div class="produto">
    <img src="infantil/moana.jpg" alt="Decoração Moana">
    <h2>Moana</h2>
    <p class="preco">R$ 300,00</p>
  </div>

  <div class="produto">
    <img src="infantil/superman.jpg" alt="Decoração Superman">
    <h2>Superman</h2>
    <p class="preco">R$ 250,00</p>
  </div>

  <div class="produto">
    <img src="infantil/poolparty.jpg" alt="Decoração Pool Party">
    <h2>Pool Party</h2>
    <p class="preco">R$ 200,00</p>
  </div>

  <div class="produto">
    <img src="infantil/hotwheels.jpg" alt="Decoração Hot Wheels">
    <h2>Hot Wheels</h2>
    <p class="preco">R$ 150,00</p>
  </div>

</div>

<a class="voltar" href="index.html">← Voltar ao início</a>

</body>
</html>
