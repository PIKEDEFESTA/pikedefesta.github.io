
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festa Infantil | Pikedefesta</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #fff5fa;
    margin: 0;
    padding: 25px;
    text-align: center;
    color: #a54888;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitulo {
    color: #75546b;
    margin-bottom: 35px;
}

.catalogo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
    max-width: 1100px;
    margin: auto;
}

.tema {
    background: white;
    border-radius: 20px;
    padding: 15px;
    box-shadow: 0 5px 20px #a5488815;
}

.tema img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: contain;
    border-radius: 15px;
}

.tema h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

.tema p {
    color: #75546b;
}

.preco {
    font-size: 26px;
    font-weight: bold;
    color: #a54888;
    margin: 15px 0;
}

.voltar {
    display: inline-block;
    background: #a54888;
    color: white;
    text-decoration: none;
    padding: 15px 30px;
    border-radius: 30px;
    margin-top: 35px;
}

@media (max-width: 600px) {
    .catalogo {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>Festa Infantil</h1>
<p class="subtitulo">Escolha o tema perfeito para sua festa!</p>

<div class="catalogo">

    <!-- TEMA SUPERMAN -->
    <div class="tema">
        <img src="infantil2.png" alt="Superman">
        <h2>Superman</h2>
        <p>Kit Pegue e Monte</p>
        <div class="preco">R$ 150,00</div>
    </div>

    <!-- TEMA BATIZADO -->
    <div class="tema">
        <img src="infantil1.png" alt="Batizado Anjinho">
        <h2>Batizado - Anjinho</h2>
        <p>Kit Pegue e Monte</p>
        <div class="preco">R$ 150,00</div>
    </div>

</div>

<a class="voltar" href="index.html">Voltar para o início</a>

</body>
</html>
